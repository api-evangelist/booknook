aid: booknook
name: BookNook
description: >-
  BookNook is a K-8 high-impact tutoring company that delivers live 1:1 and small-group
  virtual instruction in reading and math through its own online learning platform. Schools
  and districts license the platform and either use BookNook's trained tutor corps or run
  sessions with their own staff; educators work from a district dashboard that reports
  attendance, session detail, lesson-band progress, and math engagement and understanding
  scores. Students and staff reach the platform at app.booknooklearning.com and sign in
  manually or through Clever Instant Login and ClassLink single sign-on, with district
  rosters provisioned by Clever Secure Sync. BookNook operates a production API service
  (api.booknooklearning.com, listed as an "API" component on its public status page), but
  it is the platform's own backend — BookNook publishes no developer portal, no API
  reference, and no machine-readable contract, and its integration surface is consumed
  from partner platforms (Clever, ClassLink, Ed-Fi) rather than published as its own.
